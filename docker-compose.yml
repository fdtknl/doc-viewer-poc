services:
  docspace:
    image: onlyoffice/documentserver:9.2
    environment:
      JWT_ENABLED: "false"
    volumes:
      - docspace:/var/log/onlyoffice # for ONLYOFFICE Docs logs
      - docspace:/var/www/onlyoffice/Data # for certificates
      - docspace:/var/lib/onlyoffice # for file cache
      - docspace:/var/lib/postgresql # for database
    ports:
      - "80:80"

  web:
    build:
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ONLYOFFICE_URL: ${NEXT_PUBLIC_ONLYOFFICE_URL:-}
        NEXT_PUBLIC_DOCUMENT_URL: ${NEXT_PUBLIC_DOCUMENT_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - docspace
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

volumes:
  docspace: