services:
  docspace:
    image: onlyoffice/documentserver:9.2
    environment:
      JWT_ENABLED: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - docspace-logs:/var/log/onlyoffice
      - docspace-data:/var/www/onlyoffice/Data
      - docspace-lib:/var/lib/onlyoffice
      - docspace-postgresql:/var/lib/postgresql
    ports:
      - "80:80"

  web:
    build:
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ONLYOFFICE_URL: ${NEXT_PUBLIC_ONLYOFFICE_URL:-}
        NEXT_PUBLIC_DOCUMENT_URL: ${NEXT_PUBLIC_DOCUMENT_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - docspace
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

volumes:
  docspace-logs:
  docspace-data:
  docspace-lib:
  docspace-postgresql: